<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Tienda TomNET</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="skip-link" href="#contenido-principal">Ir al contenido principal</a>

    <nav class="navbar navbar-expand-md" aria-label="Principal">
        <div class="container">
            <span class="navbar-brand fw-bold">TomNET</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav-cliente" aria-controls="nav-cliente" aria-expanded="false" aria-label="Abrir menu de navegacion">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav-cliente">
                <ul class="navbar-nav ms-auto align-items-md-center gap-md-2">
                    <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="carrito.html">Carrito</a></li>
                    <li class="nav-item"><a class="nav-link" href="guia_uso.html">Ayuda</a></li>
                    <li class="nav-item"><button id="btn-salir" class="btn btn-outline-light btn-sm ms-md-2">Cerrar sesion</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main id="contenido-principal" class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-baseline gap-2">
            <h1 class="h3 mb-0">Catalogo de productos</h1>
            <p id="cotizacion-dolar" class="small text-body-secondary mb-0" aria-live="polite">Consultando cotizacion del dolar...</p>
        </div>
        <p id="usuario-actual" class="text-body-secondary"></p>

        <div class="row g-3 mb-4">
            <div class="col-12 col-md-6">
                <label for="buscar-producto" class="form-label">Buscar producto</label>
                <input id="buscar-producto" type="search" class="form-control" placeholder="Nombre del producto">
            </div>
            <div class="col-12 col-md-6">
                <label for="filtro-categoria" class="form-label">Filtrar por categoria</label>
                <select id="filtro-categoria" class="form-select">
                    <option value="todos">Todos</option>
                    <option value="celular">Celulares</option>
                    <option value="accesorio">Accesorios</option>
                </select>
            </div>
        </div>

        <div id="lista-productos" class="row g-3" aria-live="polite"></div>
    </main>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/paginas/productos.js"></script>
</body>
</html>
