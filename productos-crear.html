<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar producto - Tienda TomNET</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="skip-link" href="#contenido-principal">Ir al contenido principal</a>

    <nav class="navbar navbar-expand-md" aria-label="Principal">
        <div class="container">
            <span class="navbar-brand fw-bold">TomNET <span class="badge text-bg-light text-dark ms-1">Admin</span></span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav-admin" aria-controls="nav-admin" aria-expanded="false" aria-label="Abrir menu de navegacion">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav-admin">
                <ul class="navbar-nav ms-auto align-items-md-center gap-md-2">
                    <li class="nav-item"><a class="nav-link" href="menu-admin.html">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos-admin.html">Catalogo</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="productos-crear.html">Registrar producto</a></li>
                    <li class="nav-item"><a class="nav-link" href="ventas.html">Ventas</a></li>
                    <li class="nav-item"><a class="nav-link" href="guia_uso.html">Ayuda</a></li>
                    <li class="nav-item"><button id="btn-salir" class="btn btn-outline-light btn-sm ms-md-2">Cerrar sesion</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main id="contenido-principal" class="container py-4">
        <div class="card tarjeta-form mx-auto">
            <div class="card-body p-4">
                <h1 class="h3 mb-1">Registrar producto</h1>
                <p id="usuario-actual" class="text-body-secondary"></p>

                <form id="form-crear-producto" novalidate>
                    <div class="mb-3">
                        <label for="producto-nombre" class="form-label">Nombre</label>
                        <input id="producto-nombre" type="text" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="producto-descripcion" class="form-label">Descripcion</label>
                        <textarea id="producto-descripcion" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="producto-imagen" class="form-label">Imagen del producto (URL, opcional)</label>
                        <img id="vista-previa-imagen" src="img/placeholder.svg" alt="Vista previa de la imagen del producto" class="img-thumbnail mt-2" style="max-width: 160px;">
                    </div>
                    <div class="row g-3">
                        <div class="col-12 col-sm-6">
                            <label for="producto-precio" class="form-label">Precio de venta</label>
                            <input id="producto-precio" type="number" min="0" step="0.01" class="form-control" required>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label for="producto-stock" class="form-label">Stock</label>
                            <input id="producto-stock" type="number" min="0" class="form-control" required>
                        </div>
                    </div>
                    <div class="row g-3 mt-0">
                        <div class="col-12 col-sm-6">
                            <label for="producto-iva" class="form-label">Tipo de IVA</label>
                            <select id="producto-iva" class="form-select">
                                <option value="basico">IVA basico (22%)</option>
                                <option value="minimo">IVA minimo (10%)</option>
                                <option value="exento">Exento</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label for="producto-categoria" class="form-label">Categoria</label>
                            <select id="producto-categoria" class="form-select">
                                <option value="celular">Celulares</option>
                                <option value="accesorio">Accesorios</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap gap-2 mt-4">
                        <button class="btn btn-primary" type="submit">Guardar producto</button>
                        <a class="btn btn-secondary" href="productos-admin.html">Ver catalogo</a>
                        <a class="btn btn-outline-secondary" href="menu-admin.html">Volver al menu</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

  

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/paginas/productosCrear.js"></script>
</body>
</html>
