<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion - Tienda TomNET</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-auth">
    <a class="skip-link" href="#contenido-principal">Ir al contenido principal</a>

    <nav class="navbar navbar-expand" aria-label="Principal">
        <div class="container">
            <span class="navbar-brand fw-bold">TomNET</span>
            <a class="btn btn-outline-light btn-sm" href="guia_uso.html">Ayuda</a>
        </div>
    </nav>

    <main id="contenido-principal" class="container d-flex justify-content-center py-5">
        <div class="card tarjeta-auth">
            <div class="card-body p-4">
                <h1 class="h3 mb-4 text-center">Iniciar sesion</h1>

                <form id="form-login" novalidate>
                    <div class="mb-3">
                        <label for="login-correo" class="form-label">Correo</label>
                        <input id="login-correo" name="correo" type="email" class="form-control" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="login-contrasena" class="form-label">Contrasena</label>
                        <input id="login-contrasena" name="contrasena" type="password" class="form-control" autocomplete="current-password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Entrar</button>
                </form>

                <p class="text-center mt-3 mb-0">
                    <a href="index.html">Crear cuenta</a>
                </p>
            </div>
        </div>
    </main>


    <script type="module" src="js/paginas/login.js"></script>
</body>
</html>
